<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile</title>
  <meta name="theme-color" content="#08080a">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/profile.js"></script>
</head>
<body data-page="profile" data-title="title.profile">
  <div id="site-header"></div>

  <main>
    <div class="container" style="padding-top:calc(var(--header-h) + 40px)">
      <div class="loading" id="p-loading" data-i18n="common.loading"></div>
      <div id="gate" hidden></div>

      <div id="profile-wrap" hidden>
        <!-- Header card -->
        <div class="profile-hero">
          <div class="profile-banner banner-red" id="p-banner"></div>
          <div class="profile-hero-body">
            <div id="p-avatar-xl"></div>
            <div>
              <h1 id="p-hero-name"></h1>
              <p class="muted" id="p-hero-email"></p>
              <p class="muted small" id="p-since"></p>
            </div>
          </div>
        </div>

        <div class="profile-layout">
          <!-- Edit form -->
          <form class="card" id="profile-form" novalidate>
            <h3 class="form-section-title" data-i18n="profile.details"></h3>

            <div class="field" style="margin-bottom:1.4rem">
              <span class="field-label" data-i18n="profile.photo"></span>
              <div class="photo-row">
                <div id="p-avatar"></div>
                <div>
                  <div class="photo-actions">
                    <label class="btn btn-red btn-sm" for="p-file"><span data-i18n="profile.upload"></span></label>
                    <input type="file" id="p-file" accept="image/*" hidden>
                    <button type="button" class="btn btn-ghost btn-sm" id="p-google" data-i18n="profile.useGoogle"></button>
                    <button type="button" class="btn btn-danger btn-sm" id="p-remove" data-i18n="profile.remove"></button>
                  </div>
                  <p class="hint" style="margin:.5rem 0 0" data-i18n="profile.photoHint"></p>
                </div>
              </div>
            </div>

            <div class="field" style="margin-bottom:1.4rem">
              <span class="field-label" data-i18n="profile.banner"></span>
              <div class="swatches" id="p-swatches">
                <button type="button" class="swatch banner-red" data-banner="red" data-i18n-aria="color.red" data-i18n-title="color.red"></button>
                <button type="button" class="swatch banner-crimson" data-banner="crimson" data-i18n-aria="color.crimson" data-i18n-title="color.crimson"></button>
                <button type="button" class="swatch banner-ember" data-banner="ember" data-i18n-aria="color.ember" data-i18n-title="color.ember"></button>
                <button type="button" class="swatch banner-carbon" data-banner="carbon" data-i18n-aria="color.carbon" data-i18n-title="color.carbon"></button>
              </div>
            </div>

            <div class="form-grid">
              <div class="field">
                <label for="p-name" data-i18n="profile.name"></label>
                <input id="p-name" type="text" maxlength="80" autocomplete="name">
              </div>
              <div class="field">
                <label for="p-phone" data-i18n="profile.phone"></label>
                <input id="p-phone" type="tel" maxlength="30" autocomplete="tel">
              </div>
              <div class="field full">
                <label for="p-company" data-i18n="profile.company"></label>
                <input id="p-company" type="text" maxlength="100" autocomplete="organization">
              </div>
              <div class="field full">
                <label for="p-bio" data-i18n="profile.bio"></label>
                <textarea id="p-bio" maxlength="500" data-i18n-placeholder="profile.bioPh"></textarea>
              </div>
              <div class="field full">
                <label for="p-email" data-i18n="profile.email"></label>
                <input id="p-email" type="email" readonly>
                <span class="hint" data-i18n="profile.emailNote"></span>
              </div>
            </div>

            <button type="submit" class="btn btn-red" id="p-save" style="margin-top:1.6rem"></button>
          </form>

          <!-- Bookings & requests -->
          <div class="side-stack">
            <section class="card" id="bookings">
              <h3 data-i18n="profile.bookings"></h3>
              <div class="list" id="p-bookings"></div>
            </section>
            <section class="card" id="requests">
              <h3 data-i18n="profile.requests"></h3>
              <div class="list" id="p-requests"></div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
</body>
</html>
