<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile</title>
  <meta name="theme-color" content="#08080a">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/profile.js"></script>
</head>
<body data-page="profile" data-title="title.profile">
  <div id="site-header"></div>

  <main>
    <div class="container pf-wait" id="p-loading"><div class="loading" data-i18n="common.loading"></div></div>
    <div class="container pf-wait" id="gate" hidden></div>

    <div id="profile-wrap" hidden>
      <!-- Cover + identity -->
      <section class="pf-hero">
        <div class="pf-cover banner-red" id="p-banner">
          <div class="pf-cover-grid" aria-hidden="true"></div>
          <div class="pf-cover-scan" aria-hidden="true"></div>
          <span class="pf-cover-id" id="p-cover-id" aria-hidden="true"></span>
        </div>
        <div class="container pf-head">
          <div class="pf-avatar">
            <span class="pf-ring" aria-hidden="true"></span>
            <div id="p-avatar-xl"></div>
            <span class="pf-online" aria-hidden="true"></span>
            <label class="pf-cam" for="p-file" data-i18n-title="profile.upload" data-i18n-aria="profile.upload">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
            </label>
          </div>
          <div class="pf-id">
            <span class="eyebrow" data-i18n="nav.profile"></span>
            <h1 id="p-hero-name"></h1>
            <p class="muted" id="p-hero-email"></p>
            <p class="pf-since" id="p-since"></p>
          </div>
          <div class="pf-stats">
            <div class="pf-stat"><strong data-stat="bookings">0</strong><span data-i18n="profile.stat.bookings"></span></div>
            <div class="pf-stat"><strong data-stat="requests">0</strong><span data-i18n="profile.stat.requests"></span></div>
            <div class="pf-stat"><strong data-stat="days">0</strong><span data-i18n="profile.stat.days"></span></div>
          </div>
        </div>
      </section>

      <div class="container pf-body">
        <!-- Tabs -->
        <div class="pf-tabs" id="pf-tabs" role="tablist">
          <span class="pf-tab-ind" aria-hidden="true"></span>
          <button type="button" role="tab" data-tab="overview" class="active"><span data-i18n="profile.tab.overview"></span></button>
          <button type="button" role="tab" data-tab="edit"><span data-i18n="profile.tab.edit"></span></button>
          <button type="button" role="tab" data-tab="bookings"><span data-i18n="profile.bookings"></span><em class="pf-count" data-count="bookings">0</em></button>
          <button type="button" role="tab" data-tab="requests"><span data-i18n="profile.requests"></span><em class="pf-count" data-count="requests">0</em></button>
        </div>

        <!-- Overview -->
        <section class="pf-pane" data-pane="overview">
          <div class="pf-grid">
            <article class="card spot pf-card pf-complete">
              <div class="pf-ring-chart" aria-hidden="true">
                <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" class="trk"/><circle cx="60" cy="60" r="50" class="val" id="p-ring"/></svg>
                <strong id="p-pct">0%</strong>
              </div>
              <div>
                <h3 data-i18n="profile.complete"></h3>
                <p class="muted small" id="p-complete-hint"></p>
                <ul class="pf-checklist" id="p-checklist"></ul>
              </div>
            </article>

            <article class="card spot pf-card pf-next" id="p-next"></article>

            <article class="card spot pf-card pf-latest" id="p-latest"></article>

            <article class="card pf-card pf-quick">
              <h3 data-i18n="profile.quick"></h3>
              <div class="pf-quick-grid">
                <a href="book.html" class="qa"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span data-i18n="nav.book"></span></a>
                <a href="custom.html" class="qa"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/></svg><span data-i18n="nav.custom"></span></a>
                <a href="shop.html" class="qa"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 8h18M7 21h10"/></svg><span data-i18n="nav.shop"></span></a>
                <a href="settings.html" class="qa"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-i18n="nav.settings"></span></a>
              </div>
            </article>
          </div>
        </section>

        <!-- Edit -->
        <section class="pf-pane" data-pane="edit" hidden>
          <form class="card pf-card pf-form" id="profile-form" novalidate>
            <div class="pf-form-grid">
              <div class="pf-side">
                <span class="field-label" data-i18n="profile.photo"></span>
                <label class="dropzone" id="dropzone" for="p-file">
                  <div id="p-avatar"></div>
                  <span class="dz-text" data-i18n="profile.drop"></span>
                  <span class="hint" data-i18n="profile.photoHint"></span>
                </label>
                <input type="file" id="p-file" accept="image/*" hidden>
                <div class="photo-actions">
                  <button type="button" class="btn btn-ghost btn-sm" id="p-google" data-i18n="profile.useGoogle"></button>
                  <button type="button" class="btn btn-danger btn-sm" id="p-remove" data-i18n="profile.remove"></button>
                </div>

                <span class="field-label" style="margin-top:1.4rem" data-i18n="profile.banner"></span>
                <div class="swatches" id="p-swatches">
                  <button type="button" class="swatch banner-red" data-banner="red" data-i18n-aria="color.red" data-i18n-title="color.red"></button>
                  <button type="button" class="swatch banner-crimson" data-banner="crimson" data-i18n-aria="color.crimson" data-i18n-title="color.crimson"></button>
                  <button type="button" class="swatch banner-ember" data-banner="ember" data-i18n-aria="color.ember" data-i18n-title="color.ember"></button>
                  <button type="button" class="swatch banner-carbon" data-banner="carbon" data-i18n-aria="color.carbon" data-i18n-title="color.carbon"></button>
                </div>
              </div>

              <div class="form-grid">
                <div class="field">
                  <label for="p-name" data-i18n="profile.name"></label>
                  <input id="p-name" type="text" maxlength="80" autocomplete="name">
                </div>
                <div class="field">
                  <label for="p-phone" data-i18n="profile.phone"></label>
                  <input id="p-phone" type="tel" maxlength="30" autocomplete="tel">
                </div>
                <div class="field full">
                  <label for="p-company" data-i18n="profile.company"></label>
                  <input id="p-company" type="text" maxlength="100" autocomplete="organization">
                </div>
                <div class="field full">
                  <label for="p-bio" data-i18n="profile.bio"></label>
                  <textarea id="p-bio" maxlength="500" data-i18n-placeholder="profile.bioPh"></textarea>
                  <span class="hint" id="p-bio-count">0 / 500</span>
                </div>
                <div class="field full">
                  <label for="p-email" data-i18n="profile.email"></label>
                  <input id="p-email" type="email" readonly>
                  <span class="hint" data-i18n="profile.emailNote"></span>
                </div>
                <div class="full pf-save-row">
                  <button type="submit" class="btn btn-red" id="p-save"></button>
                </div>
              </div>
            </div>
          </form>
        </section>

        <!-- Bookings -->
        <section class="pf-pane" data-pane="bookings" id="bookings" hidden>
          <div id="p-bookings" class="pf-timeline"></div>
        </section>

        <!-- Requests -->
        <section class="pf-pane" data-pane="requests" id="requests" hidden>
          <div id="p-requests" class="pf-reqs"></div>
        </section>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
</body>
</html>
