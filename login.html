<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <meta name="theme-color" content="#08080a">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/login.js"></script>
</head>
<body data-page="login" data-title="title.login">
  <div id="site-header"></div>

  <main>
    <div class="container auth-wrap">
      <div class="card auth-card reveal">
        <div class="auth-side">
          <span class="eyebrow" data-i18n="login.eyebrow"></span>
          <h2 data-i18n="login.title"></h2>
          <ul>
            <li data-i18n="login.perk1"></li>
            <li data-i18n="login.perk2"></li>
            <li data-i18n="login.perk3"></li>
          </ul>
        </div>

        <div class="auth-main">
          <!-- Signed out -->
          <div id="login-out">
            <div class="auth-tabs" id="auth-tabs" data-tab="customer" role="tablist">
              <span class="tab-knob" aria-hidden="true"></span>
              <button type="button" role="tab" class="active" data-tab="customer" data-i18n="login.customer"></button>
              <button type="button" role="tab" data-tab="admin" data-i18n="login.adminTab"></button>
            </div>

            <!-- Customer: Google -->
            <div class="tab-pane" id="pane-customer">
              <h2 data-i18n="nav.signin"></h2>
              <p class="muted" data-i18n="login.sub"></p>
              <button type="button" class="btn btn-google" id="google-btn"></button>
              <p class="hint" data-i18n="login.note"></p>
            </div>

            <!-- Admin: username + password -->
            <form class="tab-pane" id="pane-admin" hidden novalidate>
              <h2 data-i18n="login.adminTitle"></h2>
              <p class="muted" data-i18n="login.adminSub"></p>
              <div class="field" style="margin-bottom:1rem">
                <label for="a-user" data-i18n="login.username"></label>
                <input id="a-user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="40" required>
              </div>
              <div class="field" style="margin-bottom:1.4rem">
                <label for="a-pass" data-i18n="login.password"></label>
                <div class="pw-wrap">
                  <input id="a-pass" type="password" autocomplete="current-password" maxlength="100" required>
                  <button type="button" class="pw-toggle" id="pw-toggle" data-i18n-aria="login.show">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
              </div>
              <button type="submit" class="btn btn-red btn-block" id="admin-btn"></button>
            </form>
          </div>

          <!-- Signed in -->
          <div id="login-in" hidden>
            <p class="muted" data-i18n="login.signedIn"></p>
            <div class="signed-in-box" id="signed-in-box"></div>
            <a class="btn btn-red btn-block" id="go-btn" href="profile.html" data-i18n="login.goProfile"></a>
            <button type="button" class="btn btn-ghost btn-block" style="margin-top:.7rem" id="login-signout" data-i18n="nav.signout"></button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
</body>
</html>
