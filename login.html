<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <meta name="theme-color" content="#08080a">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/login.js"></script>
</head>
<body data-page="login" data-title="title.login">
  <div id="site-header"></div>

  <main>
    <div class="container auth-wrap">
      <div class="card auth-card reveal">
        <div class="auth-side">
          <span class="eyebrow" data-i18n="login.eyebrow"></span>
          <h2 data-i18n="login.title"></h2>
          <ul>
            <li data-i18n="login.perk1"></li>
            <li data-i18n="login.perk2"></li>
            <li data-i18n="login.perk3"></li>
          </ul>
        </div>

        <div class="auth-main">
          <!-- Signed out -->
          <div id="login-out">
            <div class="auth-tabs" id="auth-tabs" data-tab="signin" role="tablist">
              <span class="tab-knob" aria-hidden="true"></span>
              <button type="button" role="tab" class="active" data-tab="signin" data-i18n="login.tabSignin"></button>
              <button type="button" role="tab" data-tab="signup" data-i18n="login.tabSignup"></button>
            </div>

            <h2 id="auth-title" data-i18n="login.welcomeBack"></h2>
            <p class="muted" id="auth-sub" data-i18n="login.signinSub"></p>

            <button type="button" class="btn btn-google" id="google-btn"></button>
            <div class="or-line"><span data-i18n="login.or"></span></div>

            <!-- Sign in -->
            <form class="tab-pane" id="pane-signin" novalidate>
              <div class="field">
                <label for="si-email" data-i18n="login.email"></label>
                <input id="si-email" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="120">
              </div>
              <div class="field">
                <div class="label-row">
                  <label for="si-pass" data-i18n="login.password"></label>
                  <button type="button" class="link-btn" id="forgot" data-i18n="login.forgot"></button>
                </div>
                <div class="pw-wrap">
                  <input id="si-pass" type="password" autocomplete="current-password" maxlength="100">
                  <button type="button" class="pw-toggle" data-pw="si-pass" data-i18n-aria="login.show">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
              </div>
              <p class="form-error" id="si-error" role="alert"></p>
              <button type="submit" class="btn btn-red btn-block" id="si-btn"></button>
              <p class="switch-line"><span data-i18n="login.noAccount"></span> <button type="button" class="link-btn" data-go="signup" data-i18n="login.tabSignup"></button></p>
            </form>

            <!-- Create account -->
            <form class="tab-pane" id="pane-signup" hidden novalidate>
              <div class="field">
                <label for="su-name" data-i18n="login.name"></label>
                <input id="su-name" type="text" autocomplete="name" maxlength="80">
              </div>
              <div class="field">
                <label for="su-email" data-i18n="login.email"></label>
                <input id="su-email" type="text" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="120">
              </div>
              <div class="form-grid">
                <div class="field">
                  <label for="su-pass" data-i18n="login.password"></label>
                  <div class="pw-wrap">
                    <input id="su-pass" type="password" autocomplete="new-password" maxlength="100">
                    <button type="button" class="pw-toggle" data-pw="su-pass" data-i18n-aria="login.show">
                      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                  </div>
                </div>
                <div class="field">
                  <label for="su-pass2" data-i18n="login.confirm"></label>
                  <input id="su-pass2" type="password" autocomplete="new-password" maxlength="100">
                </div>
              </div>
              <div class="pw-meter" aria-hidden="true"><span id="pw-bar"></span></div>
              <p class="form-error" id="su-error" role="alert"></p>
              <button type="submit" class="btn btn-red btn-block" id="su-btn"></button>
              <p class="switch-line"><span data-i18n="login.haveAccount"></span> <button type="button" class="link-btn" data-go="signin" data-i18n="login.tabSignin"></button></p>
            </form>

            <p class="hint" style="margin-top:1rem" data-i18n="login.note"></p>
          </div>

          <!-- Signed in -->
          <div id="login-in" hidden>
            <p class="muted" data-i18n="login.signedIn"></p>
            <div class="signed-in-box" id="signed-in-box"></div>
            <a class="btn btn-red btn-block" id="go-btn" href="profile.html" data-i18n="login.goProfile"></a>
            <button type="button" class="btn btn-ghost btn-block" style="margin-top:.7rem" id="login-signout" data-i18n="nav.signout"></button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
</body>
</html>
