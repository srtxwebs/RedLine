<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin panel</title>
  <meta name="theme-color" content="#08080a">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" crossorigin>
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/i18n.js">
  <link rel="modulepreload" href="js/config.js">
  <link rel="modulepreload" href="js/firebase.js">
  <link rel="modulepreload" href="js/firebase-config.js">
  <link rel="modulepreload" href="js/listings.js">
  <script type="module" src="js/admin.js"></script>
</head>
<body data-page="admin" data-title="title.admin">
  <div id="site-header"></div>

  <main>
    <section class="page-head">
      <div class="container">
        <span class="eyebrow" data-i18n="admin.eyebrow"></span>
        <h1 data-i18n="admin.title"></h1>
        <span class="ver-tag" aria-hidden="true">v8</span>
        <p class="muted" data-i18n="admin.sub"></p>
      </div>
    </section>

    <div class="container">
      <div class="loading" id="a-loading" data-i18n="common.loading"></div>

      <!-- Not signed in / not admin -->
      <div id="a-denied" class="card gate" hidden>
        <div class="gate-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </div>
        <h2 data-i18n="admin.denied"></h2>
        <p class="muted" data-i18n="admin.deniedSub"></p>
        <a class="btn btn-red" href="login.html?next=admin.html" data-i18n="nav.signin"></a>
      </div>

      <div id="a-panel" hidden>
        <div class="setup-warn" id="a-warn" hidden></div>
        <div class="admin-toolbar">
          <div class="tabs" role="tablist">
            <button type="button" class="tab active" role="tab" data-tab="listings"><span data-i18n="admin.listings"></span><span class="count" id="count-listings"></span></button>
            <button type="button" class="tab" role="tab" data-tab="bookings"><span data-i18n="admin.bookings"></span><span class="count" id="count-bookings"></span></button>
            <button type="button" class="tab" role="tab" data-tab="requests"><span data-i18n="admin.requests"></span><span class="count" id="count-requests"></span></button>
          </div>
          <div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">
            <div class="field">
              <label for="a-filter" class="small" data-i18n="admin.filter"></label>
              <select id="a-filter"></select>
            </div>
            <button type="button" class="btn btn-dark btn-sm" id="a-refresh" data-i18n="admin.refresh"></button>
            <button type="button" class="btn btn-red btn-sm" id="a-new">+ <span data-i18n="admin.newListing"></span></button>
          </div>
        </div>
        <div class="admin-list" id="a-list"></div>
      </div>
    </div>

    <!-- Listing editor -->
    <div class="modal" id="editor" hidden role="dialog" aria-modal="true" aria-labelledby="ed-title">
      <div class="modal-backdrop" data-ed-close></div>
      <form class="modal-panel narrow" id="ed-form" novalidate>
        <button type="button" class="modal-close" data-ed-close data-i18n-aria="lst.cancel">✕</button>
        <div class="editor-body">
          <h2 id="ed-title"></h2>

          <div class="form-block">
            <span class="field-label" data-i18n="lst.images"></span>
            <p class="hint" style="margin:.2rem 0 .8rem" data-i18n="lst.imagesHint"></p>
            <div class="img-editor" id="ed-images"></div>
            <input type="file" id="ed-file" accept="image/*" multiple hidden>
          </div>

          <div class="form-block">
            <div class="form-grid">
              <div class="field">
                <label for="ed-titleEn"><span data-i18n="lst.titleEn"></span><span class="req">*</span></label>
                <input id="ed-titleEn" type="text" maxlength="90">
              </div>
              <div class="field">
                <label for="ed-titleEs" data-i18n="lst.titleEs"></label>
                <input id="ed-titleEs" type="text" maxlength="90">
              </div>
              <div class="field full">
                <label for="ed-descEn" data-i18n="lst.descEn"></label>
                <textarea id="ed-descEn" maxlength="2500" rows="4"></textarea>
              </div>
              <div class="field full">
                <label for="ed-descEs" data-i18n="lst.descEs"></label>
                <textarea id="ed-descEs" maxlength="2500" rows="4"></textarea>
                <span class="hint" data-i18n="lst.langHint"></span>
              </div>
              <div class="field">
                <label for="ed-price"><span data-i18n="lst.price"></span> (<span id="ed-cur"></span>)<span class="req">*</span></label>
                <input id="ed-price" type="number" min="0" step="1" inputmode="numeric">
              </div>
              <div class="field">
                <label for="ed-category" data-i18n="lst.category"></label>
                <select id="ed-category"></select>
              </div>
              <div class="field">
                <label for="ed-url" data-i18n="lst.url"></label>
                <input id="ed-url" type="url" maxlength="300" placeholder="https://">
              </div>
              <div class="field">
                <label for="ed-status" data-i18n="lst.status"></label>
                <select id="ed-status">
                  <option value="available" data-i18n="shop.available"></option>
                  <option value="sold" data-i18n="shop.sold"></option>
                  <option value="hidden" data-i18n="shop.hidden"></option>
                </select>
              </div>
            </div>
          </div>

          <div class="editor-foot">
            <button type="button" class="btn btn-danger btn-sm" id="ed-delete" data-i18n="lst.delete"></button>
            <div class="right">
              <button type="button" class="btn btn-ghost" data-ed-close data-i18n="lst.cancel"></button>
              <button type="submit" class="btn btn-red" id="ed-save"></button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>
  <!-- If this box shows up, js/admin.js on the website is an old copy: upload it again -->
  <div class="setup-warn old-file" id="old-file-warn" hidden></div>
  <script>
    setTimeout(function () {
      if (window.__ADMIN_V >= 8) return;
      var l = "en"; try { l = (localStorage.getItem("site.lang") || navigator.language || "en").slice(0, 2); } catch (e) {}
      var m = {
        en: "<b>Old file detected.</b> The file js/admin.js on your website is an old version, so saving listings will fail. Upload the new js/admin.js to the js folder on GitHub (replace the old one), wait 1 minute and refresh with Ctrl+Shift+R.",
        es: "<b>Archivo viejo detectado.</b> El archivo js/admin.js de tu sitio es una versión vieja, por eso no se pueden guardar los sitios. Sube el nuevo js/admin.js a la carpeta js en GitHub (reemplaza el viejo), espera 1 minuto y recarga con Ctrl+Shift+R.",
        de: "<b>Alte Datei erkannt.</b> Die Datei js/admin.js auf deiner Website ist veraltet, deshalb schlägt das Speichern fehl. Lade die neue js/admin.js in den js-Ordner auf GitHub hoch (alte ersetzen), warte 1 Minute und lade mit Strg+Umschalt+R neu.",
        pt: "<b>Arquivo antigo detectado.</b> O arquivo js/admin.js do seu site é uma versão antiga, por isso salvar falha. Envie o novo js/admin.js para a pasta js no GitHub (substitua o antigo), espere 1 minuto e recarregue com Ctrl+Shift+R."
      };
      var box = document.getElementById("old-file-warn");
      box.innerHTML = m[l] || m.en; box.hidden = false;
    }, 5000);
  </script>
</body>
</html>
